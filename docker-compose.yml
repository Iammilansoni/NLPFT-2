# =============================================================================
# NLPForge — local stack (EXECUTION_MODE=local, fully offline after first boot)
# =============================================================================
#   cp .env.example .env        # set POSTGRES_PASSWORD, REDIS_PASSWORD, SECRET_KEY
#   docker compose up -d        # first boot pulls ~2.3 GB of Ollama models
#   open http://localhost:3000  # "Try the demo" logs into the seeded tenant
#
# Configuration comes from ONE file, the repo-root .env (Backend/.env is also
# read if present, for backwards compatibility). Hostnames of the services inside
# this network are set here, not in .env, so the same .env works unchanged.
# =============================================================================

x-backend-env: &backend-env
  # In-network addresses. These override anything in .env on purpose.
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nlpforge}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-nlpforge}
  SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-nlpforge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nlpforge}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
  OLLAMA_HOST: http://ollama:11434
  OLLAMA_BASE_URL: http://ollama:11434
  EXECUTION_MODE: local
  EXTRACTION_MODEL: ${EXTRACTION_MODEL:-llama3.2:3b}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    # pgvector/pgvector ships the `vector` extension the retrieval tables need.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nlpforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nlpforge}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once on a new data directory: creates the nlpforge_admin role the
      # RLS migration grants its maintenance policy to.
      - ./Backend/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nlpforge} -d ${POSTGRES_DB:-nlpforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    # redis-stack (not plain redis): existing volumes may hold RediSearch data
    # from v1's Redis vector index, which plain redis cannot load.
    image: redis/redis-stack-server:latest
    environment:
      REDIS_ARGS: >-
        --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
        --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      # Keep models resident: reloading a 3B model on CPU costs tens of seconds.
      OLLAMA_KEEP_ALIVE: "24h"
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # One-shot: make sure the embedding and extraction models exist before the
  # API starts. A no-op (seconds) once they are in the ollama_models volume.
  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull nomic-embed-text && ollama pull ${EXTRACTION_MODEL:-llama3.2:3b}
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: nlpforge-backend:latest
    env_file:
      - path: ./.env
        required: false
      - path: ./Backend/.env
        required: false
    environment:
      <<: *backend-env
      # Seed the demo tenant (20 API templates, embedded) on every boot.
      # Idempotent: refreshes the demo vectors, never touches other tenants.
      SEED_DEMO: ${SEED_DEMO:-true}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Admin account created only when the users table is empty. Unset means
      # a localhost-only default (see Backend/seed_admin.py).
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@nlpforge.dev}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_datasets:/app/datasets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  celery-worker:
    image: nlpforge-backend:latest
    command: >
      celery -A app.worker.celery_app:celery_app worker -B
      --schedule=/tmp/celerybeat-schedule
      --loglevel=info --concurrency=2 --queues=nlpforge --hostname=worker@%h
    env_file:
      - path: ./.env
        required: false
      - path: ./Backend/.env
        required: false
    environment:
      <<: *backend-env
    volumes:
      - backend_datasets:/app/datasets  # worker writes generated CSVs, API serves them
    depends_on:
      backend:
        condition: service_healthy
    # The image's HEALTHCHECK probes the API port, which a worker never opens.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app:celery_app inspect ping --timeout 10 >/dev/null"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        # Empty => the browser calls same-origin /api/*, which Next.js proxies to
        # BACKEND_INTERNAL_URL (baked into the build by next.config.js rewrites).
        NEXT_PUBLIC_API_URL: ""
        BACKEND_INTERNAL_URL: http://backend:8000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        # Shows the demo banner and the one-click "Try the demo" login.
        NEXT_PUBLIC_DEMO_MODE: ${DEMO_MODE:-true}
    image: nlpforge-frontend:latest
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_datasets:
  ollama_models:
