services:
  # PostgreSQL Database - Primary data storage
  postgres:
    image: postgres:15-alpine
    container_name: nlpforge-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=nlpforge
      - POSTGRES_PASSWORD=nlpforge_secure_password
      - POSTGRES_DB=nlpforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nlpforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nlpforge-network

  # Redis service for vector storage and caching
  redis:
    image: redis/redis-stack:latest
    container_name: nlpforge-redis
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight UI
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nlpforge-network

  # Backend FastAPI service
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: nlpforge-backend
    ports:
      - "8000:8000"
    environment:
      # PostgreSQL Configuration
      - DATABASE_URL=postgresql://nlpforge:nlpforge_secure_password@postgres:5432/nlpforge
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=nlpforge
      - POSTGRES_PASSWORD=nlpforge_secure_password
      - POSTGRES_DB=nlpforge
      
      # Redis Configuration
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      
      # Application Configuration
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
    volumes:
      - ./Backend/storage:/app/storage
      - ./Backend/datasets:/app/datasets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - nlpforge-network

  # Frontend Next.js service
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: nlpforge-frontend
    ports:
      - "3000:3000"
    environment:
      # Public environment variables (exposed to browser)
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      
      # Server-side environment variables (Next.js SSR)
      - API_URL=http://backend:8000
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - nlpforge-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  nlpforge-network:
    driver: bridge
