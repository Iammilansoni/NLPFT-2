# =============================================================================
# NLPForge-Tester - Production Docker Compose (Host Ollama)
# =============================================================================
# Ollama runs on HOST (http://localhost:11434)
# Docker stack connects via host.docker.internal (Linux-safe)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: nlpforge-postgres
    hostname: postgres
    env_file:
      - ./Backend/.env
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nlpforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nlpforge_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-nlpforge}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nlpforge} -d ${POSTGRES_DB:-nlpforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - nlpforge-network

  # ---------------------------------------------------------------------------
  # Redis Stack (Vector DB + RedisInsight)
  # ---------------------------------------------------------------------------
  redis:
    image: redis/redis-stack:latest
    container_name: nlpforge-redis
    hostname: redis
    env_file:
      - ./Backend/.env
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      REDIS_ARGS: >-
        --requirepass ${REDIS_PASSWORD:-nlpforge_redis_secure_password_2024}
        --appendonly yes
        --appendfsync everysec
        --maxmemory 1gb
        --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nlpforge_redis_secure_password_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nlpforge-network

  # ---------------------------------------------------------------------------
  # Redis Commander
  # ---------------------------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: nlpforge-redis-commander
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-nlpforge_redis_secure_password_2024}
      HTTP_USER: ${REDIS_COMMANDER_USER:-admin}
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASSWORD:-admin123}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nlpforge-network

  # ---------------------------------------------------------------------------
  # pgAdmin
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nlpforge-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nlpforge-network

  # ---------------------------------------------------------------------------
  # Backend (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: nlpforge-backend:latest
    container_name: nlpforge-backend
    env_file:
      - ./Backend/.env
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-nlpforge_redis_secure_password_2024}@redis:6379/0
      REDIS_HOST: redis
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_HOST: http://ollama:11434
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://10.0.0.1:3000}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - backend_storage:/app/storage
      - backend_datasets:/app/datasets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - nlpforge-network

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    image: nlpforge-frontend:latest
    container_name: nlpforge-frontend
    
    
    
    ports:
      - "3000:3000"
    environment:
      # Leave NEXT_PUBLIC_API_URL empty so the client uses relative paths (same-origin)
      NEXT_PUBLIC_API_URL: "http://10.0.0.1:8000"
      BACKEND_INTERNAL_URL: http://backend:8000
      # Do not expose an absolute API URL to the client; keep API_URL empty for builds
      API_URL: ""
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nlpforge-network

  # ---------------------------------------------------------------------------
  # Ollama (Local Embeddings Server)
  # Note: Replace `ollama/ollama:latest` with the correct Ollama image if needed.
  # If you prefer to run Ollama on the host, omit this service and keep OLLAMA_HOST pointing
  # to the host (e.g. http://host.docker.internal:11434).
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: nlpforge-ollama
    # Do not bind host port 11434 if Ollama is already running on the host.
    # Containers can reach this service at http://ollama:11434 via the Docker network.
    # If you need host access to this container, map to a different host port (e.g. "11435:11434").
    restart: unless-stopped
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - nlpforge-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  backend_storage:
  backend_datasets:

# =============================================================================
# Network
# =============================================================================
networks:
  nlpforge-network:
    driver: bridge
