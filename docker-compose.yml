services:
  # Redis service for vector storage (Dataset Generator)
  redis:
    image: redis/redis-stack:latest
    container_name: nlpforge-redis
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight UI
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nlpforge-network

  # MongoDB service for NLP testing features
  mongo:
    image: mongo:5.0
    container_name: nlpforge-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - nlpforge-network

  # Backend FastAPI service
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: nlpforge-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DATABASE=nlpforge
      - ENVIRONMENT=production
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
    volumes:
      - ./Backend/storage:/app/storage
      - ./Backend/datasets:/app/datasets
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - nlpforge-network

  # Frontend Next.js service
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: nlpforge-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000  # Client-side URL (browser)
      - API_URL=http://backend:8000  # Server-side URL (SSR in container)
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - nlpforge-network

volumes:
  redis_data:
    driver: local
  mongo_data:
    driver: local

networks:
  nlpforge-network:
    driver: bridge
