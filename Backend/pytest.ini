[pytest]
# The repo had no pytest config, yet ci.yml runs `-m "not integration"`.
# Unregistered marks only warn, so the selection worked by luck; a typo in a
# mark name would have silently included tests CI meant to skip.

testpaths = tests
asyncio_mode = strict

markers =
    integration: needs live infrastructure (PostgreSQL, Redis, Ollama). Skipped in CI.
    unit: pure unit test, no external dependencies.
    slow: takes more than a few seconds.
    eval: routing-quality benchmark rather than a correctness test.
    auth: authentication and authorization suite.
    datasets: dataset lifecycle suite.

filterwarnings =
    ignore::DeprecationWarning:passlib.*

addopts = --strict-markers --tb=short
