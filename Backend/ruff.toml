# Ruff configuration
#
# WHY THIS FILE EXISTS
# --------------------
# The project had no ruff config at all, and CI ran `pip install ruff` unpinned.
# Lint results therefore depended on whichever ruff version CI happened to
# install that day: the same code that passed under an older ruff reported 2010
# errors under 0.16, and CI went red without a single line of source changing.
#
# A lint gate that can fail on an unrelated day is not a gate. Rules and version
# are both explicit now.

target-version = "py311"
line-length = 100

[lint]
# The rules actually enforced. This is deliberately close to ruff's classic
# default (E4/E7/E9/F) plus import hygiene, because those catch real defects:
# the F821s this config first surfaced were three endpoints calling a service
# deleted in the v2 refactor, and one referencing an undefined `db`.
#
# Modernisation families (UP, B, SIM, RUF, ...) report ~1900 additional findings
# across the legacy surface. They are worth adopting, but as a deliberate
# migration with its own commit -- not as a silent gate that blocks unrelated
# work. Enable them one family at a time.
select = [
    "E4",   # imports
    "E7",   # statements
    "E9",   # syntax / IO errors
    "F",    # pyflakes: undefined names, unused imports, redefinitions
    "I",    # import sorting
]

ignore = [
    "E402",  # module-import-not-at-top: metrics.py imports after a guarded block
    "F401",  # unused-import: re-exports in __init__.py; revisit with __all__
]

[lint.per-file-ignores]
# Migrations are generated; their import style is alembic's, not ours.
"alembic/**" = ["I001", "F401"]
# Tests deliberately import fixtures they do not directly reference.
"tests/**" = ["F401", "F811"]

[lint.isort]
known-first-party = ["app"]
