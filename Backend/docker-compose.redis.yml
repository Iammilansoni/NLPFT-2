version: '3.8'

services:
  # Redis Database
  redis:
    image: redis/redis-stack:latest
    container_name: nlpforge-redis
    ports:
      - "6379:6379"      # Redis port
      - "8001:8001"      # RedisInsight UI port
    volumes:
      - redis-data:/data
    environment:
      - REDIS_ARGS=--save 60 1000 --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis Commander - Alternative Web UI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: nlpforge-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:
    driver: local

networks:
  default:
    name: nlpforge-network
