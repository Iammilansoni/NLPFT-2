# observability/alertmanager/alertmanager.yml
global:
  resolve_timeout: 5m
  # Configure SMTP for email alerts
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@nlpforge.dev'
  smtp_require_tls: false

# Inhibition rules — suppress lower-severity alerts when critical ones fire
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster']

# Routes
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    # Critical alerts — immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h

    # Security alerts
    - match:
        team: security
      receiver: 'security-team'
      group_wait: 15s

    # Warning alerts — batched
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 5m

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:9999/webhook'  # Placeholder — replace with Slack/Teams webhook
        send_resolved: true

  - name: 'critical-alerts'
    # Uncomment and configure for production:
    # slack_configs:
    #   - api_url: '${SLACK_WEBHOOK_URL}'
    #     channel: '#nlpforge-critical'
    #     title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    webhook_configs:
      - url: 'http://localhost:9999/webhook'
        send_resolved: true

  - name: 'security-team'
    webhook_configs:
      - url: 'http://localhost:9999/webhook'
        send_resolved: true

  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://localhost:9999/webhook'
        send_resolved: true
