name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install ruff
      - run: ruff check app/

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio pytest-cov pytest-timeout
      - name: Run backend tests
        run: pytest -v --tb=short -m "not integration" --timeout=60
        env:
          TESTING: "true"
          ENVIRONMENT: testing
          SECRET_KEY: test-secret-key-for-ci-minimum-32-chars
          SECRET_KEY_ENCRYPTION: dGVzdC1lbmNyeXB0aW9uLWtleS1mb3ItY2ktcnVucw==
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SMTP_USER: test@localhost
          SMTP_PASSWORD: test-placeholder
          REDIS_HOST: localhost
          OLLAMA_HOST: http://localhost:11434

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
