name: CI

on:
  push:
    # v2-ai-harness carries the active refactor, so it needs the same gates as
    # main. Without it here the branch pushed with zero CI coverage.
    branches: [main, develop, v2-ai-harness]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # PINNED. Unpinned, CI installed whatever ruff released most recently, so
      # the same source went from passing to 2010 errors without a code change.
      # Bump this deliberately, with the fixes in the same commit.
      - run: pip install ruff==0.16.4
      - run: ruff check app/

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio pytest-cov pytest-timeout
      - name: Run backend tests
        run: pytest -v --tb=short -m "not integration" --timeout=60
        env:
          TESTING: "true"
          ENVIRONMENT: testing
          SECRET_KEY: test-secret-key-for-ci-minimum-32-chars
          SECRET_KEY_ENCRYPTION: dGVzdC1lbmNyeXB0aW9uLWtleS1mb3ItY2ktcnVucw==
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_HOST: localhost
          OLLAMA_HOST: http://localhost:11434

  database-integration:
    name: Migrations + RLS (PostgreSQL)
    runs-on: ubuntu-latest
    # The unit suite runs on SQLite, which cannot exercise pgvector, RLS or the
    # migration chain. This job boots the real schema on an EMPTY database the
    # way the container does, then runs the isolation tests as a NON-superuser
    # role (superusers bypass RLS, so testing as one proves nothing).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nlpforge
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: nlpforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nlpforge" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: Backend
    env:
      ENVIRONMENT: testing
      TESTING: "true"
      SECRET_KEY: test-secret-key-for-ci-minimum-32-chars
      REDIS_HOST: localhost
      OLLAMA_HOST: http://localhost:11434
      PGPASSWORD: ci_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest-timeout
      - name: Boot schema on an empty database (container boot sequence)
        env:
          DATABASE_URL: postgresql+asyncpg://nlpforge:ci_password@localhost:5432/nlpforge
        run: |
          psql -h localhost -U nlpforge -d nlpforge -f db-init/001_create_roles.sql
          python init_db_direct.py
          python scripts/run_migrations.py
          # Second boot must be a no-op, not a failure.
          python init_db_direct.py
          python scripts/run_migrations.py
      - name: Model catalogue lifecycle tests
        env:
          DATABASE_URL: postgresql+asyncpg://nlpforge:ci_password@localhost:5432/nlpforge
          ALLOW_DESTRUCTIVE_DB_TESTS: nlpforge
        run: pytest tests/integration/test_model_catalog.py -m integration -v --timeout=120
      - name: Create a non-superuser application role
        run: |
          psql -h localhost -U nlpforge -d nlpforge -c "CREATE ROLE app_ci LOGIN PASSWORD 'app_ci' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U nlpforge -d nlpforge -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO app_ci; GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO app_ci"
      - name: RLS isolation tests (as non-superuser)
        env:
          DATABASE_URL: postgresql+asyncpg://app_ci:app_ci@localhost:5432/nlpforge
        run: pytest tests/integration/test_rls_isolation.py -m integration -v --timeout=120

  routing-eval:
    name: Routing Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install numpy flashrank fastembed
      - name: Run routing benchmark
        # Gates merges on routing quality, not just on tests passing.
        #
        # Runs the PRODUCTION embedder (bge-small-en-v1.5), not the tfidf CI
        # baseline. That distinction turned out to matter enormously: measured
        # against tfidf the cross-encoder looked like a +0.111 win, and against
        # bge-small it is a -0.083 regression. Gating on the wrong embedder
        # would have locked in the wrong conclusion.
        #
        # Gates on stage1_only because that is the shipped configuration
        # (RERANKER_ENABLED defaults to false). Threshold sits below the
        # measured 0.822 to catch genuine regressions without failing on noise.
        run: >
          python evals/run_eval.py
          --embedder onnx
          --gate-strategy stage1_only
          --fail-under 0.78
          --markdown "$GITHUB_STEP_SUMMARY"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
