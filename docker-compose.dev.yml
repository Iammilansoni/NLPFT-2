# =============================================================================
# NLPForge — infrastructure only, for running backend/frontend on the host
# =============================================================================
#   docker compose -f docker-compose.dev.yml up -d
#   cp Backend/.env.example Backend/.env
#   cd Backend  && python init_db_direct.py && python scripts/run_migrations.py \
#               && python scripts/seed_demo.py && uvicorn app.main:app --reload
#   cd Frontend && npm install && npm run dev
#
# Ollama runs on the host (https://ollama.com):  ollama pull nomic-embed-text
#                                               ollama pull llama3.2:3b
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nlpforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nlpforge_dev}
      POSTGRES_DB: ${POSTGRES_DB:-nlpforge}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
      - ./Backend/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nlpforge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack-server:latest
    environment:
      REDIS_ARGS: --requirepass ${REDIS_PASSWORD:-nlpforge_dev}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - dev_redis_data:/data

volumes:
  dev_postgres_data:
  dev_redis_data:
