# =============================================================================
# NLPForge-Tester - Development Docker Compose
# =============================================================================
# Infrastructure services only - run backend/frontend locally for hot reload
# 
# Cross-platform compatible: Windows, Linux, macOS
#
# Usage:
#   Start:    docker-compose -f docker-compose.dev.yml up -d
#   Stop:     docker-compose -f docker-compose.dev.yml down
#   Logs:     docker-compose -f docker-compose.dev.yml logs -f
#   Reset:    docker-compose -f docker-compose.dev.yml down -v
#
# Then run locally:
#   Windows:
#     Backend:  cd Backend && python -m uvicorn app.main:app --reload --port 8000
#     Frontend: cd Frontend && npm run dev
#   
#   Linux/macOS:
#     Backend:  cd Backend && uvicorn app.main:app --reload --port 8000
#     Frontend: cd Frontend && npm run dev
#
# Access Points:
#   - Backend API:    http://localhost:8000 (run locally)
#   - Frontend:       http://localhost:3000 (run locally)
#   - RedisInsight:   http://localhost:8001
#   - Redis Commander: http://localhost:8081
#   - pgAdmin:        http://localhost:5050
#   - MinIO Console:  http://localhost:9001
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: nlpforge-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nlpforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nlpforge_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-nlpforge}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nlpforge} -d ${POSTGRES_DB:-nlpforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - nlpforge-network

  # ---------------------------------------------------------------------------
  # Redis Stack - Vector DB with RediSearch
  # ---------------------------------------------------------------------------
  redis:
    image: redis/redis-stack:latest
    container_name: nlpforge-redis
    hostname: redis
    ports:
      - "6379:6379"     # Redis port
      - "8001:8001"     # RedisInsight UI
    environment:
      REDIS_ARGS: >-
        --requirepass ${REDIS_PASSWORD:-nlpforge_redis_secure_password_2024}
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-nlpforge_redis_secure_password_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - nlpforge-network

  # ---------------------------------------------------------------------------
  # Redis Commander - Web UI for Redis
  # ---------------------------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: nlpforge-redis-commander
    hostname: redis-commander
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-nlpforge_redis_secure_password_2024}
      HTTP_USER: ${REDIS_COMMANDER_USER:-admin}
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASSWORD:-admin123}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nlpforge-network

  # ---------------------------------------------------------------------------
  # pgAdmin - PostgreSQL Web UI
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nlpforge-pgadmin
    hostname: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nlpforge-network

  # ---------------------------------------------------------------------------
  # MinIO - S3-compatible Object Storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: nlpforge-minio
    hostname: minio
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - nlpforge-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
    name: nlpforge-dev-postgres-data
  redis_data:
    driver: local
    name: nlpforge-dev-redis-data
  pgadmin_data:
    driver: local
    name: nlpforge-dev-pgadmin-data
  minio_data:
    driver: local
    name: nlpforge-dev-minio-data

# =============================================================================
# Networks
# =============================================================================
networks:
  nlpforge-network:
    driver: bridge
    name: nlpforge-dev-network
